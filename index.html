<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GO — Documentos legais</title>
<style>
:root {
  --bg: #ffffff;
  --fg: #1a1a1a;
  --muted: #5a5a5a;
  --accent: #b3261e;
  --border: #e4e4e4;
  --card: #f7f7f7;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #16171a;
    --fg: #eaeaea;
    --muted: #a3a3a3;
    --accent: #ff6b60;
    --border: #2c2d30;
    --card: #1f2023;
  }
}
* { box-sizing: border-box; }
html, body { background: var(--bg); }
body {
  margin: 0;
  padding: 0 16px 64px;
  background: var(--bg);
  color: var(--fg);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  line-height: 1.65;
}
.wrap { max-width: 760px; margin: 0 auto; }
header.top {
  padding: 28px 0 16px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 28px;
}
.brand { font-size: 15px; font-weight: 700; letter-spacing: 0.02em; color: var(--muted); text-transform: uppercase; }
nav.doc-nav { margin-top: 10px; display: flex; gap: 18px; font-size: 15px; }
nav.doc-nav a { color: var(--muted); text-decoration: none; }
nav.doc-nav a.active { color: var(--fg); font-weight: 700; border-bottom: 2px solid var(--accent); padding-bottom: 4px; }
nav.doc-nav a:hover { color: var(--fg); }
h1 { font-size: 26px; margin: 0 0 4px; }
h2 { font-size: 20px; margin-top: 40px; border-top: 1px solid var(--border); padding-top: 24px; }
h3 { font-size: 16px; margin-top: 28px; color: var(--fg); }
p, li { font-size: 15.5px; color: var(--fg); }
strong { color: var(--fg); }
a { color: var(--accent); }
hr { display: none; }
table { border-collapse: collapse; width: 100%; margin: 16px 0; font-size: 14px; }
th, td { border: 1px solid var(--border); padding: 8px 10px; text-align: left; vertical-align: top; }
th { background: var(--card); }
code { background: var(--card); padding: 1px 5px; border-radius: 4px; font-size: 13px; }
ul, ol { padding-left: 22px; }
footer.legal-footer { margin-top: 48px; padding-top: 20px; border-top: 1px solid var(--border); color: var(--muted); font-size: 13px; }

.landing { padding-top: 60px; text-align: center; }
.landing h1 { font-size: 28px; }
.links { margin-top: 32px; display: flex; flex-direction: column; gap: 14px; align-items: center; }
.links a {
  display: block; width: 100%; max-width: 320px; padding: 14px 18px;
  border: 1px solid var(--border); border-radius: 10px; background: var(--card);
  color: var(--fg); text-decoration: none; font-weight: 600; font-size: 15px;
}
.links a:hover { border-color: var(--accent); }
</style>
</head>
<body>
<div class="wrap landing">
  <div class="brand">GO 語 — App de estudo de Idiomas</div>
  <h1>Documentos legais</h1>
  <p style="color:var(--muted)">Política de Privacidade e Termos de Uso do aplicativo GO.</p>
  <div class="links">
    <a href="privacidade.html">Política de Privacidade →</a>
    <a href="termos.html">Termos de Uso →</a>
  </div>
</div>
</body>
</html>
